# Tests live in tests/ only. Never collect from role folders (projects/), data or packs:
# a role may write files there, and pytest would import and run them (review M5 round 6).
[pytest]
testpaths = tests
norecursedirs = projects data packs exports .venv .git
# Web tools are pre-approved on purpose; the PreToolUse hook still checks every call (Milestone 5).
filterwarnings =
    ignore:can_use_tool will not be invoked
